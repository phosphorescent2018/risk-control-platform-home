<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跑批作业处理 · risk control platform</title>
<style>
/* ===== shell ===== */
:root {
  --ink:#081936; --muted:#75798A; --faint:#9AA1B6;
  --blue:#5095FF; --blue-deep:#2F6BFF; --blue-weak:#EEF4FF;
  --line:#E8EAF2; --page:#F5F6FA;
  --green:#1F9D6B; --green-weak:#E9F7F0;
  --amber:#D98A1F; --amber-weak:#FFF4E2;
  --red:#D64545; --red-weak:#FDECEC;
}
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body {
  font-family:-apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  font-size:14px; color:var(--ink); background:var(--page);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overflow-x:auto; overflow-y:hidden;
}
.app { display:flex; height:100vh; min-height:640px; position:relative; }
.sidebar { flex:0 0 252px; width:252px; background:#fff; box-shadow:2px 0 8px rgba(29,35,41,.05); position:relative; z-index:5; transition:width .28s cubic-bezier(.645,.045,.355,1), flex-basis .28s cubic-bezier(.645,.045,.355,1); overflow:hidden; }
.brand { padding:28.5px 0 0 35.5px; }
.brand img { display:block; width:180.5px; height:auto; }
.nav { margin-top:26.5px; }
.subnav { display:flex; flex-direction:column; margin-top:2px; }
.subnav-item { position:relative; height:36px; display:flex; align-items:center; padding:0 22px 0 62px; border:0; background:none; font:inherit; font-size:13px; color:var(--muted); cursor:pointer; text-align:left; }
.subnav-item:hover { color:var(--ink); background:rgba(80,149,255,.04); }
.subnav-item.on { color:var(--blue-deep); font-weight:500; background:#F3F8FF; }
.subnav-item.on:before { content:''; position:absolute; left:0; top:8px; bottom:8px; width:2px; background:var(--blue); border-radius:1px; }

.nav-item { height:54px; display:flex; align-items:center; padding:0 22.6px 0 27.5px; cursor:pointer; color:var(--ink); font-size:14px; line-height:1; transition:background .2s; user-select:none; }
.nav-item:hover { background:rgba(80,149,255,.05); }
.nav-item .ico { width:20.5px; height:20.5px; flex:0 0 20.5px; margin-right:12px; }
.nav-item .label { flex:1 1 auto; white-space:nowrap; transform:translateY(.5px); }
.chev { width:9px; height:5.4px; flex:0 0 9px; color:var(--ink); opacity:.92; }
.main { flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }
.topbar { flex:0 0 56px; height:56px; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 30.5px 0 22px; box-shadow:0 2px 3px rgba(151,160,195,.08); position:relative; z-index:4; }
.hide-btn { display:flex; align-items:center; gap:6.5px; position:relative; top:-.5px; background:none; border:0; padding:0; margin:0; font:inherit; font-size:14px; color:var(--muted); cursor:pointer; transition:color .2s; }
.hide-btn:hover { color:var(--ink); }
.hide-btn svg { width:14px; height:14px; display:block; }
.top-right { display:flex; align-items:center; }
.timepill { position:relative; width:279.5px; height:30px; flex:0 0 279.5px; border:1px solid var(--line); border-radius:15px; background:#fff; white-space:nowrap; }
.timepill .clk { position:absolute; left:16px; top:6px; width:16px; height:16px; display:block; }
.timepill .tz { position:absolute; left:40.5px; top:50%; transform:translateY(-50%); color:#6193F7; font-size:12.5px; }
.timepill .date { position:absolute; left:125.5px; top:50%; transform:translateY(calc(-50% - 1.5px)); color:var(--muted); font-size:12px; }
.timepill .sync { position:absolute; left:249.5px; top:8px; width:12px; height:12px; display:block; color:var(--muted); cursor:pointer; }
.vdiv { width:1px; height:24px; background:var(--line); margin:0 0 0 19px; }
.user { display:flex; align-items:center; margin-left:18.5px; cursor:pointer; }
.avatar { width:32px; height:32px; border-radius:50%; overflow:hidden; background:#EFF2FE; display:block; }
.uname { margin-left:8px; font-size:14.2px; color:var(--muted); white-space:nowrap; transform:translateY(-.5px); }
.subbar { flex:0 0 42px; height:42px; background:#FBFBFD; border-bottom:1px solid #E8EAF2; box-shadow:0 2px 4px rgba(151,160,195,.08); position:relative; z-index:3; }
.content { flex:1 1 auto; min-height:0; padding:23px 24px 24px; background:var(--page); }
.card { height:100%; background:#fff; border-radius:16px; box-shadow:0 2px 4px rgba(151,160,195,.1); position:relative; overflow:hidden; }
.app.collapsed .sidebar { width:0; flex-basis:0; }

/* ===== workspace ===== */
.ws { display:flex; flex-direction:column; }
.ws-head { flex:0 0 auto; padding:14px 20px 12px; border-bottom:1px solid var(--line); position:relative; }
.ws-top { display:flex; align-items:center; justify-content:space-between; gap:14px; }
.ws-left { display:flex; align-items:center; gap:12px; min-width:0; }
.ws-h1 { font-size:17px; font-weight:600; letter-spacing:.2px; white-space:nowrap; }
.concept { font-size:9.5px; font-weight:500; color:#7C8AA5; background:#F2F5FA; border:1px solid #E6EAF2; border-radius:4px; padding:1px 5px; letter-spacing:0; }
.ws-meta { margin-top:7px; display:flex; align-items:center; gap:9px; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; }
.task-btn { display:inline-flex; align-items:center; gap:6px; background:none; border:0; padding:0 0 0 12px; border-left:1px solid var(--line); font:inherit; color:var(--ink); cursor:pointer; white-space:nowrap; }
.task-btn svg { width:9px; height:5.4px; color:var(--muted); }
.task-name { font-size:13px; font-weight:600; }
.task-code { font-size:11px; color:var(--muted); }
.sep { width:1px; height:10px; background:var(--line); }
.ws-right { display:flex; align-items:center; gap:10px; flex:0 0 auto; white-space:nowrap; }
.ws-right .btn, .ws-right .badge, .slice-chip { white-space:nowrap; flex:0 0 auto; }
.slice-chip { display:flex; gap:6px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:5px 9px; font-size:11.5px; color:var(--muted); background:#FBFCFE; }
.slice-chip b { color:var(--ink); font-weight:600; }
.slice-chip i { font-style:normal; color:var(--faint); }
.badge { font-size:11px; padding:4px 9px; border-radius:999px; background:var(--green-weak); color:var(--green); font-weight:500; }
.badge.running { background:var(--blue-weak); color:var(--blue-deep); }
.badge.waiting { background:var(--amber-weak); color:var(--amber); }
.task-menu { position:absolute; top:44px; left:150px; width:330px; background:#fff; border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 28px rgba(20,30,60,.12); padding:6px; z-index:20; }
.task-menu[hidden] { display:none; }
.task-menu button { display:flex; width:100%; justify-content:space-between; align-items:center; gap:10px; padding:9px 10px; border:0; background:none; border-radius:7px; text-align:left; cursor:pointer; font:inherit; }
.task-menu button:hover { background:#F6F9FE; }
.task-menu button.on { background:#F3F8FF; }
.task-menu b { font-size:12.5px; font-weight:600; display:block; }
.task-menu i { font-size:10.5px; color:var(--muted); font-style:normal; display:block; margin-top:2px; }
.task-menu em { font-size:11px; color:var(--muted); font-style:normal; }

.stages { flex:0 0 auto; display:grid; grid-template-columns:repeat(4,1fr); border-bottom:1px solid var(--line); }
.stage { position:relative; display:flex; align-items:center; gap:10px; padding:10px 16px 9px; background:#fff; border:0; border-right:1px solid var(--line); cursor:pointer; text-align:left; font:inherit; color:var(--ink); }
.stage:last-child { border-right:0; }
.stage:after { content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:transparent; }
.stage.active { background:#FAFBFF; }
.stage.active:after { background:var(--blue); }
.st-no { font-size:10.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
.st-body b { display:block; font-size:12.5px; font-weight:600; }
.st-body i { display:block; font-size:10.5px; color:var(--muted); font-style:normal; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.st-flag { margin-left:auto; width:6px; height:6px; border-radius:50%; background:#DDE2EA; flex:0 0 6px; }
.st-flag.done { background:var(--green); }
.st-flag.live { background:var(--blue); box-shadow:0 0 0 3px rgba(80,149,255,.16); }
.st-flag.warn { background:var(--amber); }

.panel-wrap { flex:1 1 auto; min-height:0; overflow:auto; padding:16px 20px 22px; background:#fff; }
.panel { display:none; }
.panel.active { display:block; }
.panel-wrap::-webkit-scrollbar { width:8px; }
.panel-wrap::-webkit-scrollbar-thumb { background:#DFE4EE; border-radius:4px; }

.box { border:1px solid var(--line); border-radius:12px; padding:13px 15px; background:#fff; }
.box-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.box h3 { margin:0; font-size:12.5px; font-weight:600; }
.box .sub { margin:3px 0 0; font-size:10.5px; color:var(--muted); }

.btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:32px; padding:0 13px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); font:inherit; font-size:12px; font-weight:500; cursor:pointer; transition:background .15s,border-color .15s; }
.btn:hover { border-color:#C9D4EA; }
.btn.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
.btn.primary:hover { background:#3F86F5; }
.btn.primary[disabled] { background:#B9CDF2; border-color:#B9CDF2; cursor:not-allowed; }
.btn.danger { color:var(--red); border-color:#F1C9C9; }
.btn.danger:hover { background:#FFF7F7; }
.btn.ghost { border-color:transparent; color:var(--muted); }
.btn.ghost:hover { color:var(--ink); background:#F6F8FC; }
.btn.wide { width:100%; height:34px; font-size:12.5px; margin-top:2px; }
.btn.sm { height:26px; padding:0 9px; font-size:11px; }

/* prepare */
.prep-grid { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:14px; align-items:stretch; }
.prep-left { display:flex; flex-direction:column; gap:14px; min-width:0; }
.form-box { align-self:stretch; }
.cal { margin-top:10px; display:grid; grid-template-columns:repeat(14,minmax(0,1fr)); gap:5px; }
.cal-col { border:1px solid transparent; border-radius:8px; padding:6px 2px 5px; text-align:center; cursor:pointer; }
.cal-col:hover { background:#F7F9FD; }
.cal-col.sel { border-color:#BFD6FF; background:#F3F8FF; }
.cal-d { font-size:10.5px; font-weight:600; color:var(--ink); white-space:nowrap; }
.cal-bars { margin-top:5px; display:flex; flex-direction:column; gap:2px; }
.cal-bars i { height:4px; border-radius:2px; background:#DDE2EB; display:block; }
.cal-bars i.ok { background:#5BC08D; }
.cal-bars i.warn { background:#E7B04A; }
.cal-bars i.bad { background:#E06B6B; }
.legend { display:flex; gap:10px; font-size:10px; color:var(--muted); align-items:center; }
.legend span { display:inline-flex; align-items:center; gap:4px; }
.legend b { width:7px; height:7px; border-radius:2px; display:inline-block; }

.cal-detail { margin-top:11px; border-top:1px solid var(--line); padding-top:9px; }
.cd-head { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); margin-bottom:3px; }
.cd-head b { color:var(--ink); font-size:11.5px; }
.cd-row { display:grid; grid-template-columns:minmax(0,1fr) 96px 64px 52px; gap:8px; align-items:center; padding:5px 0; border-bottom:1px dashed #EFF1F6; font-size:11px; }
.cd-row:last-child { border-bottom:0; }
.cd-row .nm { color:var(--ink); }
.cd-row .num { text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); }
.cd-row .dl { text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
.tag { justify-self:end; font-size:10px; padding:2px 7px; border-radius:999px; }
.tag.ok { background:var(--green-weak); color:var(--green); }
.tag.warn { background:var(--amber-weak); color:var(--amber); }
.tag.bad { background:var(--red-weak); color:var(--red); }
.tag.na { background:#F1F3F7; color:var(--faint); }

.launch h3 { margin:0 0 2px; }
.checks { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px; }
.checks li { display:flex; gap:7px; align-items:flex-start; font-size:11.5px; color:var(--ink); }
.checks li svg { width:13px; height:13px; margin-top:1px; flex:0 0 13px; }
.checks li small { color:var(--muted); font-size:10.5px; }
.est { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:11px 0 10px; padding-top:10px; border-top:1px solid var(--line); }
.est div i { display:block; font-size:9.5px; color:var(--muted); font-style:normal; }
.est div b { display:block; font-size:12px; font-weight:600; margin-top:2px; white-space:nowrap; }
.est-note { margin-top:9px; font-size:10px; color:var(--faint); }
.hint { margin-top:7px; font-size:10px; color:var(--faint); text-align:center; }

.cfg { margin-top:10px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
.cfg div i { display:block; font-size:9.5px; color:var(--faint); font-style:normal; }
.cfg div b { display:block; font-size:11.5px; font-weight:500; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

table.list { width:100%; border-collapse:collapse; font-size:11px; }
table.list th { text-align:left; font-weight:500; color:var(--muted); font-size:10px; padding:0 6px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
table.list td { padding:6px; border-bottom:1px dashed #EFF1F6; font-variant-numeric:tabular-nums; white-space:nowrap; }
table.list tr:last-child td { border-bottom:0; }
table.list td.r, table.list th.r { text-align:right; }
table.list td.mono { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:10.5px; color:var(--muted); }

.stages[hidden] { display:none; }
.stages.three { grid-template-columns:repeat(3,1fr); }
.back { border:0; background:none; padding:0; color:var(--muted); font-size:11.5px; cursor:pointer; white-space:nowrap; }
.back:hover { color:var(--ink); }
.list-head { margin:16px 0 8px; }
.list-head h3 { margin:0; font-size:12.5px; font-weight:600; }
.batch-table { width:100%; border-collapse:collapse; font-size:11.5px; }
.batch-table th { text-align:left; font-size:10px; color:var(--muted); font-weight:500; padding:0 8px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
.batch-table td { padding:9px 8px; border-bottom:1px dashed #EFF1F6; white-space:nowrap; }
.batch-table tbody tr { cursor:pointer; }
.batch-table tbody tr:hover { background:#F8FAFE; }
.batch-table td.nm { font-weight:600; }
.batch-table td.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10.5px; color:var(--muted); }
.batch-table td.r, .batch-table th.r { text-align:right; }
.tag.info { background:var(--blue-weak); color:var(--blue-deep); }

.grid3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0 18px; }
.gp-wrap { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:14px; border:1px solid var(--line); border-radius:10px; padding:12px; background:#FAFBFE; }
.gp-title { font-size:10px; color:var(--muted); margin-bottom:6px; }
.glist { display:flex; flex-direction:column; gap:6px; max-height:230px; overflow:auto; }
.gitem { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:#fff; font:inherit; font-size:11.5px; color:var(--ink); }
button.gitem { cursor:pointer; text-align:left; }
.gitem.sel { border-color:#BFD6FF; background:#F5F9FF; }
.gitem .cbx { width:12px; height:12px; border:1px solid #C9D2E2; border-radius:3px; flex:0 0 12px; }
.gitem.sel .cbx { background:var(--blue); border-color:var(--blue); position:relative; }
.gitem.sel .cbx:after { content:''; position:absolute; left:3px; top:1px; width:3px; height:6px; border:solid #fff; border-width:0 1.5px 1.5px 0; transform:rotate(45deg); }
.gitem .nm { flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gitem .gnum { font-variant-numeric:tabular-nums; color:var(--muted); }
.gitem .gx { font-style:normal; color:#8AA0C4; cursor:pointer; font-size:13px; line-height:1; }
.gitem .gx:hover { color:var(--red); }
.gitem .gchk { width:12px; height:12px; flex:0 0 12px; }
.gitem svg.gicon { width:14px; height:14px; flex:0 0 14px; color:var(--faint); }
.gp-empty { padding:18px; text-align:center; color:var(--faint); font-size:10.5px; border:1px dashed var(--line); border-radius:8px; }
.gp-total { margin-top:8px; font-size:10.5px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }

.ws-back-row { display:flex; padding:12px 20px 0; }
.ws-back-row + .ws-top { padding-top:8px; }
/* readiness strip */
.readiness { padding:14px 16px; }
.ready-row { display:flex; align-items:center; gap:9px; }
.ready-dot { width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px rgba(31,157,107,.12); flex:0 0 7px; }
.ready-row b { font-size:12.5px; font-weight:600; }
.ready-meta { font-size:11px; color:var(--muted); }
.ready-row .btn { margin-left:auto; color:var(--blue-deep); }
.ready-body { margin-top:12px; border-top:1px solid var(--line); padding-top:10px; }
.cal-head { display:flex; align-items:center; justify-content:space-between; font-size:10px; color:var(--faint); margin-bottom:7px; }
.ready-body .cal { margin-top:0; }
.ready-body .cal-col { padding:9px 4px 7px; }
.ready-body .cal-bars i { height:5px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 20px; }
.form-grid .field { margin-top:10px; }
.form-grid .span2 { grid-column:span 2; }
.push-grid .btn.wide { margin-top:12px; }
.form-foot { display:flex; justify-content:flex-end; margin-top:16px; padding-top:12px; border-top:1px solid var(--line); }

/* config form */
.form-box .box-head { margin-bottom:2px; }
.field { margin-top:10px; }
.field > label { display:block; font-size:9.5px; color:var(--muted); margin-bottom:5px; }
.static { font-size:12px; color:var(--ink); }
.opts { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.opt { border:1px solid var(--line); border-radius:8px; padding:7px 8px; background:#fff; text-align:left; cursor:pointer; font:inherit; }
.opt:hover { border-color:#C9D4EA; }
.opt.on { border-color:#BFD6FF; background:#F5F9FF; }
.opt b { display:block; font-size:11px; font-weight:600; color:var(--ink); }
.opt i { display:block; font-style:normal; font-size:9.5px; color:var(--muted); margin-top:2px; }
.ver-row { display:flex; align-items:center; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
.seg button { border:0; background:#fff; padding:5px 10px; font:inherit; font-size:11px; color:var(--ink); cursor:pointer; }
.seg button.on { background:#F0F6FF; color:var(--blue-deep); font-weight:600; }
.ver { margin-left:8px; font-size:11px; color:var(--muted); }
.ver-pill { display:inline-flex; align-items:center; height:26px; padding:0 10px; border:1px solid var(--line); border-radius:7px; font-size:11px; color:var(--ink); background:#FAFBFE; }
.groups { display:flex; flex-direction:column; gap:5px; }
.chk { display:flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:7px; padding:6px 8px; background:#fff; font:inherit; font-size:11px; color:var(--ink); cursor:pointer; text-align:left; }
.chk:hover { border-color:#C9D4EA; }
.chk.on { border-color:#BFD6FF; background:#F5F9FF; }
.cbx { width:12px; height:12px; border:1px solid #C9D2E2; border-radius:3px; flex:0 0 12px; position:relative; }
.chk.on .cbx { background:var(--blue); border-color:var(--blue); }
.chk.on .cbx:after { content:''; position:absolute; left:3px; top:1px; width:3px; height:6px; border:solid #fff; border-width:0 1.5px 1.5px 0; transform:rotate(45deg); }
.chk em { margin-left:auto; font-style:normal; color:var(--muted); font-size:10px; }
.auto-row { display:flex; align-items:center; gap:8px; margin-top:7px; font-size:10.5px; color:var(--muted); }
.auto-row .switch { margin-left:auto; width:28px; height:16px; }
.auto-row .switch:after { width:12px; height:12px; }
.auto-row .switch.on:after { left:14px; }


.input { width:100%; height:30px; border:1px solid var(--line); border-radius:7px; padding:0 9px; font:inherit; font-size:11.5px; color:var(--ink); outline:none; background:#fff; }
.input:focus { border-color:#BFD6FF; box-shadow:0 0 0 3px rgba(80,149,255,.1); }
.textarea { width:100%; min-height:50px; border:1px solid var(--line); border-radius:7px; padding:7px 9px; font:inherit; font-size:11.5px; color:var(--ink); outline:none; resize:none; background:#fff; }
.textarea:focus { border-color:#BFD6FF; box-shadow:0 0 0 3px rgba(80,149,255,.1); }
.req { color:var(--red); font-style:normal; margin-left:2px; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.row2 .field { margin-top:10px; }

/* group summary + picker */
.group-summary { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:10.5px; color:var(--muted); }
.group-summary b { color:var(--ink); font-weight:600; }
.group-chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.gchip { display:inline-flex; align-items:center; gap:5px; background:#F2F6FE; border:1px solid #DCE6F8; border-radius:6px; padding:3px 6px; font-size:10.5px; color:#2F4A78; }
.gchip i { font-style:normal; cursor:pointer; color:#8AA0C4; font-size:12px; line-height:1; }
.gchip i:hover { color:var(--red); }
.modal-mask { position:fixed; inset:0; background:rgba(15,25,45,.28); z-index:40; }
.picker { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:760px; max-width:calc(100vw - 64px); max-height:calc(100vh - 80px); background:#fff; border-radius:14px; box-shadow:0 24px 60px rgba(15,25,45,.25); z-index:41; display:flex; flex-direction:column; }
.picker-head { display:flex; justify-content:space-between; align-items:flex-start; padding:16px 18px 10px; }
.picker-head h3 { margin:0; font-size:14px; }
.picker-head p { margin:3px 0 0; font-size:10.5px; color:var(--muted); }
.picker-x { border:0; background:none; font-size:18px; color:var(--faint); cursor:pointer; line-height:1; }
.picker-search { padding:0 18px 10px; }
.picker-search input { width:100%; height:32px; border:1px solid var(--line); border-radius:8px; padding:0 10px; font:inherit; font-size:12px; outline:none; }
.picker-search input:focus { border-color:#BFD6FF; box-shadow:0 0 0 3px rgba(80,149,255,.1); }
.picker-table { flex:1 1 auto; min-height:120px; overflow:auto; padding:0 18px; }
.ghead { display:grid; grid-template-columns:24px minmax(0,1fr) 110px 130px; gap:10px; font-size:9.5px; color:var(--muted); padding:6px 8px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#fff; z-index:1; }
.ghead .r { text-align:right; }
.grow { display:grid; grid-template-columns:24px minmax(0,1fr) 110px 130px; gap:10px; align-items:center; width:100%; border:0; border-bottom:1px dashed #EFF1F6; background:#fff; padding:10px 8px; text-align:left; font:inherit; cursor:pointer; }
.grow:hover { background:#F8FAFE; }
.grow.on { background:#F3F8FF; }
.grow.on .cbx { background:var(--blue); border-color:var(--blue); position:relative; }
.grow.on .cbx:after { content:''; position:absolute; left:3px; top:1px; width:3px; height:6px; border:solid #fff; border-width:0 1.5px 1.5px 0; transform:rotate(45deg); }
.gname { display:flex; flex-direction:column; gap:2px; font-size:11.5px; color:var(--ink); min-width:0; }
.gname i { font-style:normal; font-size:9.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:340px; }
.gnum { text-align:right; font-size:11px; font-variant-numeric:tabular-nums; }
.gtime { text-align:right; font-size:9.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
.gempty { padding:26px; text-align:center; color:var(--muted); font-size:11px; }
.picker-foot { display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-top:1px solid var(--line); font-size:11px; }
.picker-foot b { font-weight:600; }
.picker-foot .btn { margin-left:6px; }

/* run */
.run-top { display:grid; grid-template-columns:132px minmax(0,1fr) auto; gap:16px; align-items:center; }
.ring { position:relative; width:124px; height:124px; }
.ring svg { transform:rotate(-90deg); }
.ring .val { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ring .val b { font-size:22px; font-weight:600; letter-spacing:-.4px; }
.ring .val i { font-style:normal; font-size:10px; color:var(--muted); margin-top:2px; }
.run-stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px 14px; }
.run-stats i { display:block; font-style:normal; font-size:9.5px; color:var(--muted); }
.run-stats b { display:block; font-size:13px; font-weight:600; margin-top:2px; font-variant-numeric:tabular-nums; }
.run-side { display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
.run-side .muted { font-size:10px; color:var(--faint); }

.idle { padding:26px 0 22px; text-align:center; }
.idle .big { font-size:13px; font-weight:600; }
.idle .sub { margin-top:4px; font-size:11px; color:var(--muted); }
.idle .btn { margin-top:12px; }

.chart-grid { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:14px; margin-top:14px; }
.chart-box svg { display:block; width:100%; }
.axis { font-size:9px; fill:#9AA1B6; }
.grid-line { stroke:#EFF1F6; stroke-width:1; }
.series { fill:none; stroke:#5095FF; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
.dot-now { fill:#fff; stroke:#5095FF; stroke-width:2; }
.shard-canvas { display:block; width:100%; height:88px; margin-top:8px; }
.pctl { display:flex; gap:12px; margin-top:8px; font-size:10px; color:var(--muted); }
.pctl b { color:var(--ink); font-weight:600; }

.anomaly { margin-top:14px; }
.anomaly ul { list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:6px; }
.anomaly li { display:flex; gap:8px; align-items:flex-start; font-size:11px; }
.anomaly li .pin { width:6px; height:6px; border-radius:50%; margin-top:4px; flex:0 0 6px; background:var(--amber); }
.anomaly li.bad .pin { background:var(--red); }
.anomaly li b { font-weight:600; }
.anomaly li span { color:var(--muted); }

/* report */
.rep-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
.rep-head .t { font-size:13px; font-weight:600; }
.rep-head .s { font-size:10.5px; color:var(--muted); margin-top:3px; }
.rep-head .actions { display:flex; gap:6px; }
.kpis { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:8px; }
.kpi { border:1px solid var(--line); border-radius:10px; padding:9px 10px; }
.kpi i { display:block; font-style:normal; font-size:9.5px; color:var(--muted); }
.kpi b { display:block; font-size:17px; font-weight:600; letter-spacing:-.3px; margin-top:3px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.kpi small { display:block; font-size:9.5px; color:var(--faint); margin-top:2px; white-space:nowrap; }
.kpi.up b { color:#C2413B; }
.kpi.down b { color:var(--green); }

.tl { margin-top:14px; }
.tl-bar { display:flex; height:16px; border-radius:4px; overflow:hidden; margin-top:10px; }
.tl-bar i { display:block; height:100%; }
.tl-legend { display:flex; gap:14px; margin-top:8px; font-size:10px; color:var(--muted); flex-wrap:wrap; }
.tl-legend span { display:inline-flex; align-items:center; gap:5px; }
.tl-legend b { width:7px; height:7px; border-radius:2px; display:inline-block; }
.tl-axis { display:flex; justify-content:space-between; font-size:9px; color:var(--faint); margin-top:5px; }

.res-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; margin-top:14px; }
.res-row { display:grid; grid-template-columns:88px minmax(0,1fr) 56px; gap:8px; align-items:center; font-size:10.5px; margin-top:8px; }
.res-row .bar { height:6px; border-radius:3px; background:#EEF1F6; overflow:hidden; }
.res-row .bar i { display:block; height:100%; background:#8FB4FF; border-radius:3px; }
.res-row .num { text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); }

.split { margin-top:10px; }
.split-bar { display:flex; height:10px; border-radius:5px; overflow:hidden; background:#EEF1F6; }
.split-bar i { display:block; height:100%; }
.split-legend { display:flex; flex-direction:column; gap:6px; margin-top:10px; }
.split-legend div { display:flex; align-items:center; gap:7px; font-size:11px; }
.split-legend b { width:8px; height:8px; border-radius:2px; }
.split-legend span { color:var(--muted); }
.split-legend em { margin-left:auto; font-style:normal; font-variant-numeric:tabular-nums; }

/* push */
.push-grid { display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:14px; }
.big-split { display:flex; gap:18px; margin:10px 0 4px; }
.big-split div i { display:block; font-style:normal; font-size:9.5px; color:var(--muted); }
.big-split div b { display:block; font-size:19px; font-weight:600; margin-top:2px; white-space:nowrap; }
.big-split .up b { color:#C2413B; }
.big-split .down b { color:var(--green); }

.steps { margin:12px 0 4px; display:flex; flex-direction:column; }
.step { display:flex; gap:9px; font-size:11px; padding-bottom:11px; position:relative; }
.step:last-child { padding-bottom:0; }
.step .dot { width:14px; height:14px; border-radius:50%; border:1.5px solid #D6DCE8; flex:0 0 14px; background:#fff; position:relative; z-index:1; display:flex; align-items:center; justify-content:center; }
.step .dot svg { width:8px; height:8px; }
.step:not(:last-child):after { content:''; position:absolute; left:6.5px; top:14px; bottom:0; width:1px; background:#E4E8F0; }
.step.done .dot { background:var(--green); border-color:var(--green); }
.step.done .dot svg { stroke:#fff; }
.step.now .dot { border-color:var(--blue); box-shadow:0 0 0 3px rgba(80,149,255,.15); }
.step b { font-weight:500; display:block; }
.step span { color:var(--muted); font-size:10px; display:block; margin-top:2px; }
.step .right { margin-left:auto; font-size:10px; color:var(--faint); white-space:nowrap; }

.switch-row { display:flex; align-items:center; justify-content:space-between; gap:10px; border-top:1px solid var(--line); margin-top:10px; padding-top:10px; font-size:11px; }
.switch { width:32px; height:18px; border-radius:9px; background:#DCE2EE; position:relative; cursor:pointer; transition:background .15s; flex:0 0 32px; }
.switch:after { content:''; position:absolute; width:14px; height:14px; border-radius:50%; background:#fff; top:2px; left:2px; transition:left .15s; box-shadow:0 1px 2px rgba(0,0,0,.15); }
.switch.on { background:var(--blue); }
.switch.on:after { left:16px; }
.switch-row small { display:block; color:var(--muted); font-size:9.5px; margin-top:2px; }
.demo-link { display:inline-block; margin-top:6px; font-size:10px; color:var(--blue-deep); cursor:pointer; text-decoration:underline; text-underline-offset:2px; }

.toast { position:fixed; left:50%; bottom:34px; transform:translateX(-50%); background:#101B33; color:#fff; font-size:12px; padding:9px 15px; border-radius:8px; box-shadow:0 8px 24px rgba(10,20,40,.2); z-index:50; }
.toast[hidden] { display:none; }

.ws-back-row { display:flex; padding:12px 20px 0; }
.ws-back-row + .ws-top { padding-top:8px; }
.matrix .seg.small button { padding:3px 8px; font-size:10px; }
.mtx { width:100%; border-collapse:collapse; margin-top:8px; table-layout:fixed; }
.mtx th { font-size:10px; color:var(--muted); font-weight:500; text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); background:#FAFBFE; }
.mtx td { font-size:11.5px; padding:8px 10px; border-bottom:1px solid #F1F3F7; vertical-align:middle; }
.mtx th:nth-child(n+2), .mtx td:nth-child(n+2) { text-align:right; }
.mtx th:first-child { width:32%; }
.mtx td.sum { color:var(--muted); }
.mtx td.pick { cursor:pointer; }
.mtx td.pick:hover { background:#F7FAFF; }
.mtx td.off b { color:#B9C0CE; }
.mtx .mk { display:inline-flex; width:12px; height:12px; border:1px solid #C9D2E2; border-radius:3px; margin-right:7px; vertical-align:-2px; font-size:9px; color:#fff; align-items:center; justify-content:center; }
.mtx td.pick:not(.off) .mk { background:var(--blue); border-color:var(--blue); }
.mtx tr.mtx-sum td { border-bottom:none; background:#FAFBFE; }
.mtx-foot { display:flex; justify-content:space-between; align-items:flex-end; gap:18px; margin-top:12px; font-size:10.5px; color:var(--muted); }
.mtx-total { text-align:right; }
.mtx-total b { font-size:16px; color:var(--ink); margin:0 4px; font-variant-numeric:tabular-nums; }
.mtx-total i { display:block; font-style:normal; color:var(--faint); margin-top:2px; }
.btn.warn { background:#E8A23B; border-color:#E8A23B; color:#fff; }
.btn.warn:hover { background:#D9912B; border-color:#D9912B; }
.arm span { display:block; margin-top:6px; font-size:10px; color:#B26B1F; text-align:center; }

.selwrap { position:relative; }
.selwrap select { appearance:none; -webkit-appearance:none; padding-right:30px; background:#fff; cursor:pointer; width:100%; }
.selwrap .chev { position:absolute; right:11px; top:50%; transform:translateY(-50%); width:10px; height:6px; color:#9AA1B6; pointer-events:none; }

.gp-wrap { grid-template-columns:minmax(0,1fr) minmax(0,1.05fr); gap:16px; padding:14px; border-radius:12px; }
.gp-search { position:relative; margin-bottom:10px; }
.gp-search input { width:100%; height:34px; border:1px solid var(--line); border-radius:8px; padding:0 12px 0 32px; font:inherit; font-size:11.5px; background:#fff; outline:none; color:var(--ink); }
.gp-search input:focus { border-color:#BCD2F7; box-shadow:0 0 0 3px rgba(80,149,255,.12); }
.gp-search svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); width:13px; height:13px; color:#9AA1B6; }
.gp-left .glist, .gp-right .glist { max-height:244px; overflow:auto; display:flex; flex-direction:column; gap:8px; }
.gitem { padding:10px 11px; transition:border-color .15s ease, background .15s ease; }
.gitem.sel { background:var(--blue); border-color:var(--blue); color:#fff; }
.gitem.sel .gnum { color:rgba(255,255,255,.9); }
.gitem.sel .gicon { color:#fff; }
.gitem.sel .gchk path { stroke:#fff; }
.gp-res-title { font-size:11px; font-weight:600; color:var(--ink); margin:2px 0 10px; }
.gcard { position:relative; border:1px solid #E7ECF6; border-radius:8px; background:#F7F9FD; padding:10px 34px 10px 14px; }
.gcard:before { content:''; position:absolute; left:0; top:8px; bottom:8px; width:3px; border-radius:2px; background:#D7E4FA; }
.gc-row { display:flex; gap:10px; font-size:10.5px; line-height:1.95; }
.gc-row .k { flex:0 0 56px; color:#9AA1B6; }
.gc-row .v { flex:1; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gc-row .v.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; color:#4B5872; }
.gcard .gx { position:absolute; right:9px; top:6px; }
.gp-foot { display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:9px; border-top:1px solid #F0F2F7; font-size:10.5px; color:var(--muted); }
.gp-foot b { color:var(--ink); font-variant-numeric:tabular-nums; }
.gp-reset { background:none; border:none; color:var(--blue-deep); font:inherit; font-size:10.5px; cursor:pointer; padding:0; }
.gp-reset:hover { text-decoration:underline; }
.foot-hint { font-size:10.5px; color:var(--red); margin-right:10px; }
.gp-empty { min-height:64px; display:flex; align-items:center; justify-content:center; }

.form-foot.split { justify-content:space-between; align-items:center; }
.run-sum { display:flex; align-items:center; gap:8px; font-size:10.5px; color:var(--muted); }
.run-sum b { color:var(--ink); font-variant-numeric:tabular-nums; }
.run-sum i { font-style:normal; color:#D5DAE4; }

.gsel { position:relative; }
.gsel-box { display:flex; align-items:center; gap:8px; width:100%; min-height:36px; border:1px solid var(--line); border-radius:8px; background:#fff; padding:5px 30px 5px 8px; cursor:pointer; font:inherit; text-align:left; }
.gsel-box:hover { border-color:#C7D7F2; }
.gsel-box.open { border-color:#BCD2F7; box-shadow:0 0 0 3px rgba(80,149,255,.12); }
.gchips { display:flex; flex-wrap:wrap; gap:6px; }
.gchip { display:inline-flex; align-items:center; gap:6px; background:#EFF5FF; border:1px solid #DCE8FC; border-radius:6px; padding:3px 7px; font-size:10.5px; color:#2E5FAE; }
.gchip b { font-weight:500; color:var(--ink); }
.gchip .n { color:#7C8CA8; font-variant-numeric:tabular-nums; }
.gchip .x { font-style:normal; color:#8AA0C4; cursor:pointer; }
.gchip .x:hover { color:var(--red); }
.gsel-ph { font-size:11.5px; color:#A6AFBF; padding-left:2px; }
.gsel-chev { position:absolute; right:11px; top:50%; width:10px; height:6px; color:#9AA1B6; pointer-events:none; }
.gsel-hint { margin-top:6px; font-size:10px; color:var(--muted); }
.gsel-hint b { color:var(--ink); font-variant-numeric:tabular-nums; }
.gpop { position:absolute; left:0; right:0; top:calc(100% + 6px); background:#fff; border:1px solid #E6E9F0; border-radius:10px; box-shadow:0 12px 32px rgba(20,40,80,.14); z-index:30; padding:10px; }
.gpop-list { max-height:230px; overflow:auto; display:flex; flex-direction:column; gap:2px; margin-top:8px; }
.gopt { display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:7px; border:none; background:none; font:inherit; font-size:11.5px; cursor:pointer; text-align:left; color:var(--ink); }
.gopt:hover { background:#F5F8FE; }
.gopt.on { background:#F2F7FF; }
.gopt .cbx { width:13px; height:13px; border:1px solid #C9D2E2; border-radius:3px; flex:0 0 13px; position:relative; }
.gopt.on .cbx { background:var(--blue); border-color:var(--blue); }
.gopt.on .cbx:after { content:''; position:absolute; left:4px; top:2px; width:3px; height:6px; border:solid #fff; border-width:0 1.5px 1.5px 0; transform:rotate(45deg); }
.gopt .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.gopt .num { color:var(--muted); font-variant-numeric:tabular-nums; }
.gpop-foot { display:flex; align-items:center; gap:10px; border-top:1px solid #F0F2F7; margin-top:8px; padding-top:8px; font-size:10.5px; color:var(--muted); }
.gpop-foot .sp { flex:1; }
.gpop-foot button { background:none; border:none; font:inherit; font-size:10.5px; cursor:pointer; color:var(--blue-deep); padding:0 2px; }
.gpop-foot button:hover { text-decoration:underline; }
.gpop.up { top:auto; bottom:calc(100% + 6px); }

.cal { gap:6px; margin-top:12px; }
.cal-col { background:#F8FAFD; border:1px solid #F1F4F9; border-radius:8px; padding:8px 3px 7px; }
.cal-col:hover { background:#F2F6FD; }
.cal-col.sel { background:#fff; border-color:#BFD6FF; box-shadow:0 3px 8px rgba(80,149,255,.10); }
.cal-d { font-size:9.5px; font-weight:600; color:#4A5872; }
.cal-bars { gap:3px; }
.cd-head { margin:13px 0 10px; font-size:10.5px; }
.cd-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.cd-card { border:1px solid var(--line); border-radius:10px; padding:10px 12px 9px; background:#FBFCFE; }
.cd-name { display:block; font-size:10px; color:var(--muted); }
.cd-card b { display:block; margin-top:5px; font-size:17px; font-weight:600; letter-spacing:-0.2px; font-variant-numeric:tabular-nums; }
.cd-card b.dim { color:#C2C9D6; }
.cd-meta { display:flex; align-items:center; justify-content:space-between; margin-top:6px; font-size:10px; }
.cd-meta .dl { font-style:normal; color:var(--muted); font-variant-numeric:tabular-nums; }

.cal { grid-template-columns:repeat(12,minmax(0,1fr)); }
.cal-col.pending { background:#FAFBFD; border-color:#F1F3F8; }
.cal-col.pending .cal-d { color:#B7BFCB; }
.cal-bars i.na { background:#E9EDF3; }

.gsel-sum { margin-top:7px; font-size:10px; color:var(--muted); }
.gsel-sum b { color:var(--ink); font-variant-numeric:tabular-nums; }
.gmeta-list { margin-top:6px; border:1px solid #F0F2F7; border-radius:8px; overflow:hidden; }
.gmeta-head, .gmeta { display:grid; grid-template-columns:minmax(0,1.05fr) 100px 132px minmax(0,1.55fr); gap:12px; padding:6px 10px; font-size:10px; align-items:center; }
.gmeta-head { background:#FAFBFE; color:#9AA1B6; font-size:9.5px; border-bottom:1px solid #F0F2F7; }
.gmeta-head span:nth-child(2) { text-align:right; }

  /* ---------- create ---------- */
  function dayStatus(s, dayISO) {
    const anchor = dateISO(addDays(new Date(), -2));
    const diff = Math.round((parseISO(dayISO) - parseISO(anchor)) / 86400000);
    if (diff > 0) return { pending: true };
    const bad = diff === -9 || diff === -8 || diff === -7;
    return { wallet: 0, od: bad ? 2 : 0, pool: 0, pending: false };
  }

  function renderCalendar() {
    const s = cur();
    const endD = parseISO(S.todayISO || s.sliceDate);
    const startD = addDays(endD, -11);
    let cols = '';
    for (let i = 0; i < 12; i++) {
      const dt = addDays(startD, i), iso = dateISO(dt), st = dayStatus(s, iso);
      const bars = st.pending
        ? '<i class="na"></i><i class="na"></i><i class="na"></i>'
        : [st.wallet, st.od, st.pool].map((v) => '<i class="' + (v === 2 ? 'bad' : 'ok') + '"></i>').join('');
      cols += '<div class="cal-col' + (st.pending ? ' pending' : '') + (iso === S.selDay ? ' sel' : '') + '" data-day="' + iso + '"><div class="cal-d">' + iso.slice(8) + '</div><div class="cal-bars">' + bars + '</div></div>';
    }
    return cols;
  }

        '<li><span class="pin"></span><div><b>分片重试 ' + (b.retries || 0) + ' 次</b> <span>瞬时超时触发，重试后全部成功</span></div><span class="tag warn">已执行</span></li>' +
        '<li><span class="pin" style="background:#DDE2EA"></span><div><b>整体重试</b> <span>' + (b.failShards > 0 ? '失败分片 ' + b.failShards + '，已自动执行整体重试' : '跑批结束后自动执行一次 · 当前失败分片 0') + '</span></div><span class="tag na">未触发</span></li>' +
      '</ul></div>' +

        '<button class="btn sm ghost" data-pdf>下载 PDF</button></div>' +

        '<div class="pdf-kpis"><i></i><i></i><i></i></div><div class="pdf-lines"><span></span><span></span><span></span><span></span></div><div class="pdf-chart"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>' +
        '<div class="pdf-side"><b>批次事件报告</b><span>共 6 个区块 · 含分片热力图与资源曲线</span><button class="btn sm primary" data-pdf>预览 / 下载</button></div></div></div>';

  function updateRunLive() {
    const b = currentBatch(); if (!b) return;
    const cfg = b.config, s = STRATEGIES[cfg.strategy];
    const p = S.pct, total = totalMin(cfg);
    const set = (id, v) => { const e = $('#' + id); if (e) e.textContent = v; };
    set('rPct', pctText(p));
    const ring = $('#ringFg'); if (ring) ring.setAttribute('stroke-dashoffset', String(2 * Math.PI * 52 * (1 - p)));
    set('rProcessed', fmt(Math.round(cfg.crowd * p)));
    set('rShards', fmt(Math.round(cfg.shards * p)) + ' / ' + fmt(cfg.shards));
    set('rSpeed', Math.round(s.speed * (0.97 + 0.03 * Math.sin(p * 14))) + ' 万/h');
    set('rEta', hhmm((1 - p) * total));
    set('rElapsed', hhmm(p * total));
    set('pDone', fmt(Math.round(cfg.shards * p)));
    set('pWait', fmt(cfg.shards - Math.round(cfg.shards * p)));
    const sub = $('#stRun'); if (sub) sub.textContent = pctText(p) + ' · 剩余 ' + hhmm((1 - p) * total);
    const shardKey = Math.floor(p * 100);
    if (S.lastChart !== shardKey) { S.lastChart = shardKey; drawLiveChart(); }
    if (S.lastShard !== shardKey) { S.lastShard = shardKey; drawShards($('#liveShards'), cfg.shards, Math.round(cfg.shards * p), 0, false); }
  }

  /* ---------- charts ---------- */
  function speedPoints(n, base, phase) {
    const pts = [];
    for (let i = 0; i < n; i++) pts.push(base * (0.9 + 0.1 * Math.sin(i * 0.9 + phase) + 0.05 * Math.cos(i * 1.7)));
    return pts;
  }

  function drawSpeed(svg, pts, labels) {
    if (!svg) return;
    const W = 520, H = 140, L = 30, R = 8, T = 10, B = 20;
    const max = Math.max.apply(null, pts) * 1.08, min = Math.min.apply(null, pts) * 0.86;
    const x = (i) => L + (W - L - R) * (i / (pts.length - 1));
    const y = (v) => T + (H - T - B) * (1 - (v - min) / (max - min || 1));
    let path = '';
    pts.forEach((v, i) => { path += (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; });
    const area = path + 'L' + x(pts.length - 1).toFixed(1) + ' ' + (H - B) + ' L' + x(0).toFixed(1) + ' ' + (H - B) + ' Z';
    let grid = '';
    for (let i = 0; i <= 2; i++) {
      const gy = T + (H - T - B) * i / 2, val = Math.round(max - (max - min) * i / 2);
      grid += '<line class="grid-line" x1="' + L + '" y1="' + gy + '" x2="' + (W - R) + '" y2="' + gy + '"/><text class="axis" x="' + (L - 5) + '" y="' + (gy + 3) + '" text-anchor="end">' + val + '</text>';
    }
    const lab = labels.map((s, i) => '<text class="axis" x="' + (L + (W - L - R) * i / (labels.length - 1)) + '" y="' + (H - 5) + '" text-anchor="' + (i === 0 ? 'start' : i === labels.length - 1 ? 'end' : 'middle') + '">' + s + '</text>').join('');
    const uid = 'g' + Math.random().toString(36).slice(2, 7);
    svg.innerHTML = '<defs><linearGradient id="' + uid + '" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5095FF" stop-opacity=".18"/><stop offset="1" stop-color="#5095FF" stop-opacity="0"/></linearGradient></defs>' +
      grid + '<path d="' + area + '" fill="url(#' + uid + ')"/><path class="series" d="' + path + '"/><circle class="dot-now" cx="' + x(pts.length - 1).toFixed(1) + '" cy="' + y(pts[pts.length - 1]).toFixed(1) + '" r="3"/>' + lab;
  }

  function drawLiveChart() {
    const b = currentBatch(); if (!b) return;
    const s = STRATEGIES[b.config.strategy];
    const pct = b.status === 'running' ? S.pct : 1;
    const n = Math.max(4, Math.round(10 + pct * 14));
    drawSpeed($('#liveChart'), speedPoints(n, s.speed, 1), ['60m', '45m', '30m', '15m', '现在']);
  }

  function drawShards(canvas, total, done, failed, heat) {
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth || 380, H = 88;
    canvas.width = W * dpr; canvas.height = H * dpr;
    const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr); ctx.clearRect(0, 0, W, H);
    const cols = 120, rows = Math.ceil(total / cols), cw = W / cols, ch = H / rows;
    for (let i = 0; i < total; i++) {
      const r = Math.floor(i / cols), c = i % cols;
      let color = '#E9EDF4';
      if (i < done) {
        if (failed && i % 997 === 0 && i < failed * 3) color = '#E06B6B';
        else if (heat) {
          const v = Math.sin(r * 0.55 + c * 0.35) + Math.cos(r * 0.23 - c * 0.61);
          color = v > 0.95 ? '#2E9C6E' : v > 0.15 ? '#45B383' : v > -0.7 ? '#5BC08D' : '#8FD3AE';
        } else color = '#5BC08D';
      }
      ctx.fillStyle = color;
      ctx.fillRect(c * cw + 0.15, r * ch + 0.15, Math.max(0.5, cw - 0.3), Math.max(0.5, ch - 0.3));
    }
  }

    const segsData = [{ k: '切片搬运', m: 63, c: '#5BC08D' }, { k: '等待启动', m: s.waitMin, c: '#C6D0E2' }, { k: '跑批执行', m: runMin, c: '#5095FF' }];
    const segs = segsData.map((x) => '<i style="width:' + (x.m / total * 100).toFixed(2) + '%;background:' + x.c + '"></i>').join('');
    const tleg = segsData.map((x) => '<span><b style="background:' + x.c + '"></b>' + x.k + ' ' + hhmm(x.m) + '</span>').join('');
    const axis = '<span>' + b.started.slice(11, 16) + '</span><span></span><span></span><span>' + b.ended.slice(11, 16) + '</span>';
    const pI = inc / cfg.crowd * 100, pD = dec / cfg.crowd * 100, pK = keep / cfg.crowd * 100;
    const splitLegend = '<div><b style="background:#E06B6B"></b>提额 <span>' + wan(inc) + '</span><em>' + pI.toFixed(1) + '%</em></div>' +
      '<div><b style="background:#4FAE8A"></b>降额 <span>' + wan(dec) + '</span><em>' + pD.toFixed(1) + '%</em></div>' +

    const res = s.res.map((r) => '<div class="res-row"><span>' + r.k + '</span><span class="bar"><i style="width:' + r.p + '%"></i></span><span class="num">' + r.v + '</span></div>').join('');
    const anom = s.anomalies.map((a) => '<li class="' + (a.lv === 'bad' ? 'bad' : '') + '"><span class="pin"></span><div><b>' + a.t + '</b> <span>' + a.d + '</span></div></li>').join('');

    $('#panelDetail').innerHTML = '<div class="rep-head"><div><div class="t">事件报告</div>' +

      '<div class="actions"><button class="btn sm" data-mock="导出报告">导出报告</button><button class="btn sm" data-mock="完整事件报告">完整事件报告</button></div></div>' +

      '<div class="box"><h3>分片耗时</h3><p class="sub">每格 = 1 个分片，颜色越深耗时越长</p><canvas class="shard-canvas" id="repShards"></canvas><div class="pctl"><span>P50 <b>16s</b></span><span>P90 <b>19s</b></span><span>P99 <b>33s</b></span><span>最慢 <b>67s</b></span></div></div></div>' +
      '<div class="res-grid"><div class="box"><h3>结果分布</h3><div class="split"><div class="split-bar"><i style="width:' + pI.toFixed(2) + '%;background:#E06B6B"></i><i style="width:' + pD.toFixed(2) + '%;background:#4FAE8A"></i><i style="flex:1;background:#C9D2E2"></i></div><div class="split-legend">' + splitLegend + '</div></div></div>' +

    requestAnimationFrame(function () {
      drawSpeed($('#repSpeed'), speedPoints(26, s.speed, 0.4), [b.started.slice(11, 16), '', '', '', b.ended.slice(11, 16)]);
      drawShards($('#repShards'), cfg.shards, cfg.shards, 0, true);
    });
  }

  /* ---------- push ---------- */
  function pushStepInfo(i) {
    const b = currentBatch(), cfg = b.config;
    const batchNo = b.pushBatch || 'D' + b.id.slice(0, 8).replace(/_/g, '') + '-01';
    return [
      { t: '校验批次', s: b.pushStep >= 1 ? '已完成 · 明细已审批' : '待校验批次与明细', r: '' },
      { t: '创建 LMS 批次', s: b.pushStep >= 2 ? 'LMS 批次 ' + batchNo : '待创建 LMS 批次', r: '' },
      { t: '推送明细', s: wan(cfg.crowd) + ' 条待调额记录', r: '' },
      { t: 'LMS 批量改额', s: '需在 LMS 后台点【发起批量更新】', r: b.pushStep >= 5 ? '已完成' : '待发起' }
    ][i];
  }

  function renderPush() {
    const b = currentBatch();
    if (!b || b.status !== 'completed') {
      $('#panelDetail').innerHTML = '<div class="box idle"><div class="big">跑批完成后才能推送</div><div class="sub">报告生成后可推送 LMS 改额</div></div>';
      return;
    }
    const cfg = b.config, s = STRATEGIES[cfg.strategy];
    const steps = [0, 1, 2, 3].map((i) => {
      const done = (i < 3 && b.pushStep > i) || (i === 3 && b.pushStep >= 5);
      const now = (b.pushStep === i + 1) || (i === 3 && b.pushStep === 4);
      const info = pushStepInfo(i);
      return '<div class="step ' + (done ? 'done' : now ? 'now' : '') + '"><span class="dot">' + (done ? '<svg viewBox="0 0 10 10" fill="none"><path d="M2 5.2l2 2 4-4.4" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '') + '</span><div><b>' + info.t + '</b><span>' + info.s + '</span></div><span class="right">' + info.r + '</span></div>';
    }).join('');
    const disabled = b.pushStep >= 3;
    const btnText = b.pushStep >= 5 ? '已改额 · 完成' : b.pushStep >= 3 ? '已推送 LMS' : '推送至 LMS';
    const recRows = b.pushStep >= 3
      ? '<tr><td>' + (b.pushedAt || nowText()) + '</td><td class="mono">' + (b.pushBatch || 'D20261104-1015') + '</td><td>Hu Tang</td><td class="r">' + fmt(cfg.crowd) + '</td><td><span class="tag ' + (b.pushStep >= 5 ? 'ok' : 'warn') + '">' + (b.pushStep >= 5 ? '已改额' : '待改额') + '</span></td></tr>'
      : '<tr><td colspan="5" style="color:#9AA1B6">暂无推送记录</td></tr>';
    const inc = Math.round(cfg.crowd * 0.055), dec = Math.round(cfg.crowd * 0.09), keep = cfg.crowd - inc - dec;
    const buckets = [
      ['提额', '0 – 5 万', Math.round(inc * 0.66)], ['提额', '5 万以上', Math.round(inc * 0.34)],
      ['降额', '0 – 5 万', Math.round(dec * 0.71)], ['降额', '5 万以上', Math.round(dec * 0.29)]
    ].map((r) => '<tr><td><span class="tag ' + (r[0] === '提额' ? 'bad' : 'ok') + '">' + r[0] + '</span></td><td>' + r[1] + '</td><td class="r">' + fmt(r[2]) + '</td><td class="r">' + (r[2] / cfg.crowd * 100).toFixed(2) + '%</td></tr>').join('');

    const TIERS3 = [
      { n: 'T1_>5Y_KYC', s: 0.2171 }, { n: 'T2_2-5Y_KYC', s: 0.2551 }, { n: 'T3_6M-2Y', s: 0.2991 },
      { n: 'T4_<6M', s: 0.2245 }, { n: 'T5_NoKYC', s: 0.0042 }
    ];
    const ODS = ['STABLE', 'CONSTRAINED', 'WATCHLIST', 'GROWTH', '空'];
    const ODW = {
      inc: [0.55, 0.12, 0.05, 0.01, 0.27],
      dec: [0.10, 0.08, 0.07, 0.01, 0.74],
      keep: [0.08, 0.02, 0.01, 0.005, 0.885]
    };
    const CAT = { inc: inc, dec: dec, keep: keep };
    if (!S.mcat) S.mcat = 'inc';
    const gridOf = function (c) {
      const g = TIERS3.map(function (t) {
        return ODS.map(function (o, j) { return Math.round(CAT[c] * t.s * ODW[c][j]); });
      });
      const flat = g.reduce(function (a, r) { return a.concat(r); }, []);
      const diff = CAT[c] - flat.reduce(function (a, n) { return a + n; }, 0);
      g[4][4] += diff;
      return g;
    };
    const BASE = [12000, 10000, 8000, 6000, 4000];
    const defMult = function (c) {
      if (c === 'inc') return [{ m: 1, s: 5 }, { m: 2.5, s: 95 }];
      if (c === 'dec') return [{ m: 1, s: 40 }, { m: 0.6, s: 60 }];
      return [{ m: 1, s: 100 }];
    };
    if (!b.sel3) b.sel3 = {};
    if (!b.mult3) b.mult3 = {};
    ['inc', 'dec', 'keep'].forEach(function (c) {
      if (!b.sel3[c]) b.sel3[c] = TIERS3.map(function () { return ODS.map(function () { return true; }); });
      if (!b.mult3[c]) b.mult3[c] = TIERS3.map(function () { return ODS.map(function () { return defMult(c).map(function (x) { return { m: x.m, s: x.s }; }); }); });
    });
    const cat = S.mcat;
    const grid = gridOf(cat);
    const yi = function (v) { return (Math.abs(v) / 1e8).toFixed(2) + ' 亿'; };
    const cellAmt = function (c, i, j) {
      const g = gridOf(c);
      return b.mult3[c][i][j].reduce(function (a, br) { return a + g[i][j] * (br.s / 100) * BASE[i] * (br.m - 1); }, 0);
    };
    const rows3 = TIERS3.map(function (t, i) {
      const cells = ODS.map(function (o, j) {
        const on = b.sel3[cat][i][j];
        const amt = cellAmt(cat, i, j);
        return '<td class="mcell' + (on ? '' : ' off') + '" data-msel="' + i + '-' + j + '"><div class="mcell-in"><button class="mtx-ck' + (on ? ' on' : '') + '"><span class="mk">' + (on ? '✓' : '') + '</span></button><div class="mc-v"><b>' + fmt(grid[i][j]) + '</b><span>' + (amt ? (amt > 0 ? '+' : '−') + yi(amt) : '—') + '</span></div></div></td>';
      }).join('');
      const sum = ODS.reduce(function (a, o, j) { return a + (b.sel3[cat][i][j] ? grid[i][j] : 0); }, 0);
      return '<tr><td class="tl">' + t.n + '</td>' + cells + '<td class="r sum">' + fmt(sum) + '</td></tr>';
    }).join('');
    const colSum = ODS.map(function (o, j) { return TIERS3.reduce(function (a, t, i) { return a + (b.sel3[cat][i][j] ? grid[i][j] : 0); }, 0); });
    const selOf = function (c) {
      const g = gridOf(c);
      return TIERS3.reduce(function (a, t, i) { return a + ODS.reduce(function (a2, o, j) { return a2 + (b.sel3[c][i][j] ? g[i][j] : 0); }, 0); }, 0);
    };
    const amtOf = function (c) {
      return TIERS3.reduce(function (a, t, i) { return a + ODS.reduce(function (a2, o, j) { return a2 + (b.sel3[c][i][j] ? cellAmt(c, i, j) : 0); }, 0); }, 0);
    };
    const selInc = selOf('inc'), selDec = selOf('dec'), selKeep = selOf('keep');
    const catSel = cat === 'inc' ? selInc : cat === 'dec' ? selDec : selKeep;
    const incAmt = amtOf('inc'), decAmt = amtOf('dec'), netAmt = incAmt + decAmt;
    const edit = S.editCell && S.editCell.indexOf(cat + ':') === 0 ? S.editCell.split(':')[1].split('-').map(Number) : null;
    const editBrackets = edit ? b.mult3[cat][edit[0]][edit[1]] : [];
    const shareSum = editBrackets.reduce(function (a, br) { return a + (+br.s || 0); }, 0);
    const editor = edit ? '<div class="mult-edit"><div class="me-head">倍率配置 · ' + TIERS3[edit[0]].n + ' × ' + ODS[edit[1]] + '<span>该格 ' + fmt(grid[edit[0]][edit[1]]) + ' 人 · 基准额度 ' + fmt(BASE[edit[0]]) + '</span></div>' +
      '<div class="me-rows">' + editBrackets.map(function (br, k) {
        return '<div class="me-row"><span class="me-l">倍率</span><input class="me-in" type="number" step="0.1" min="0" value="' + br.m + '" data-mrow="' + k + '" data-mfield="m"><span class="me-x">×</span><span class="me-l">占比</span><input class="me-in" type="number" step="1" min="0" max="100" value="' + br.s + '" data-mrow="' + k + '" data-mfield="s"><span class="me-x">%</span><button class="me-del" data-mdel="' + k + '">×</button></div>';
      }).join('') + '</div>' +
      '<div class="me-foot"><span class="' + (shareSum === 100 ? '' : 'bad') + '">占比合计 ' + shareSum + '%</span><button class="lnk" data-madd>+ 添加档位</button><span class="sp"></span><button class="lnk" data-medone>完成</button></div>' +
      '<div class="me-note">占比内按随机抽取，人数取整；金额 = 人数 × 占比 × 基准额度 × (倍率 − 1)</div></div>' : '';
    const matrix = '<div class="box matrix"><div class="box-head"><div><h3>结果加工 · 额度矩阵</h3><p class="sub">调额方向 × opportunity_od × history_tier；点格子配置倍率与占比</p></div>' +
      '<div class="seg small"><button data-mcat="inc" class="' + (cat === 'inc' ? 'on' : '') + '">提额</button><button data-mcat="dec" class="' + (cat === 'dec' ? 'on' : '') + '">降额</button><button data-mcat="keep" class="' + (cat === 'keep' ? 'on' : '') + '">不变</button></div></div>' +
      '<div class="mtx-tools"><span>已选 <b>' + fmt(catSel) + '</b> / 共 <b>' + fmt(CAT[cat]) + '</b> 人</span><span class="sp"></span><button class="lnk" data-mall>全选</button><button class="lnk" data-mnone>清空</button></div>' +
      '<table class="mtx mtx3"><thead><tr><th>history_tier</th>' + ODS.map(function (o) { return '<th>' + o + '</th>'; }).join('') + '<th class="r">小计</th></tr></thead><tbody>' + rows3 +
      '<tr class="mtx-sum"><td class="tl">合计</td>' + colSum.map(function (n) { return '<td>' + fmt(n) + '</td>'; }).join('') + '<td class="r">' + fmt(catSel) + '</td></tr></tbody></table>' +
      editor +
      '<div class="mtx-foot"><span>本次调整 <b>' + fmt(selInc) + '</b> 提额 · <b>' + fmt(selDec) + '</b> 降额 · <b>' + fmt(selKeep) + '</b> 不变</span>' +
      '<span class="mtx-total">本次预计调额额度 <b>' + (netAmt >= 0 ? '+' : '−') + yi(netAmt) + '</b><i>提额 +' + yi(incAmt) + ' · 降额 −' + yi(Math.abs(decAmt)) + '</i></span></div></div>';

    const netAll = incAmt + decAmt;
    $('#panelDetail').innerHTML = matrix + '<div class="push-grid" style="margin-top:14px"><div class="box"><div class="box-head"><div><h3>调额汇总</h3><p class="sub">' + b.id + ' · ' + s.label + ' ' + versionOf(cfg) + ' · ' + hhmm(totalMin(cfg)) + '</p></div></div>' +
      '<div class="big-split four"><div class="up"><i>提额</i><b>' + wan(inc) + '</b></div><div class="down"><i>降额</i><b>' + wan(dec) + '</b></div><div><i>维持</i><b>' + wan(keep) + '</b></div><div class="net"><i>净额度变化</i><b class="' + (netAll >= 0 ? 'up' : 'down') + '">' + (netAll >= 0 ? '+' : '−') + yi(Math.abs(netAll)) + '</b></div></div>' +
      '<table class="list" style="margin-top:8px"><thead><tr><th>方向</th><th>区间</th><th class="r">人数</th><th class="r">占比</th></tr></thead><tbody>' + buckets + '</tbody></table></div>' +
      '<div class="box"><div class="box-head"><div><h3>推送至 LMS</h3><p class="sub">DE 批次 → LMS 批次 → 批量改额</p></div></div><div class="steps">' + steps + '</div>' +
      (b.pushStep === 4 ? '<span class="demo-link" data-complete>演示：模拟 LMS 完成改额</span>' : '') +
      (b.pushStep >= 3
        ? '<button class="btn primary wide" disabled>' + (b.pushStep >= 5 ? '已改额 · 完成' : '已推送 LMS') + '</button>'
        : (S.pushArm
          ? '<div class="arm"><button class="btn warn wide" data-push>确认推送（再次点击）</button><span>推送后名单将写入 LMS 并等待批量改额，不可撤回</span></div>'
          : '<button class="btn primary wide" data-push>推送至 LMS · 已选 ' + fmt(selInc + selDec) + ' 人</button>')) + '</div></div>' +
      '<div class="box" style="margin-top:14px"><div class="box-head"><div><h3>推送记录</h3></div></div><table class="list" style="margin-top:8px"><thead><tr><th>时间</th><th>LMS 批次</th><th>操作人</th><th class="r">明细条数</th><th>状态</th></tr></thead><tbody>' + recRows + '</tbody></table></div>';
  }

  /* ---------- shell ---------- */
  let lastView = null, lastTab = null;
  function renderApp() {
    const pw = document.querySelector('.panel-wrap');
    const sameCtx = S.view === lastView;
    const keepY = pw ? pw.scrollTop : 0;
    $$('.subnav-item').forEach((el) => el.classList.toggle('on', true));
    $('#wsHead').innerHTML = '<div class="ws-head">' + renderHead() + '</div>';
    $('#stages').hidden = S.view !== 'detail';
    $$('.panel').forEach((el) => { el.classList.remove('active'); });
    if (S.view === 'list') { renderList(); $('#panelList').classList.add('active'); }
    else if (S.view === 'create') { renderCreate(); $('#panelCreate').classList.add('active'); }
    else {
      $('#panelDetail').classList.add('active');
      renderStages();
      if (S.tab === 'run') renderRun();
      if (S.tab === 'report') renderReport();
      if (S.tab === 'push') renderPush();
    }
    const mr = $('#modalRoot');
    if (mr) mr.innerHTML = S.confirmOpen ? renderConfirm() : '';
    lastView = S.view; lastTab = S.tab;
    if (pw) { const target = sameCtx ? keepY : 0; requestAnimationFrame(function () { pw.scrollTop = target; }); }
  }

  function renderConfirm() {
    const s = cur(), cfg = snap();
    const groups = s.groups.filter((g) => S.groups.includes(g.id));
    const names = groups.map((g) => g.name).join('、');
    const row = (k, v) => '<div class="cf-row"><span>' + k + '</span><b>' + v + '</b></div>';
    return '<div class="modal-mask" data-confirm-mask><div class="confirm">' +
      '<div class="cf-head"><h3>确认发起跑批</h3><p>' + (S.scheduleMode === 'at' ? '请核对以下配置，确认后将按设定时间自动跑批' : '请核对以下配置，确认后将立即校验切片并开始跑批') + '</p></div>' +
      '<div class="cf-body">' +
        row('业务线', 'MTN_Uganda') +
        row('策略', s.label + ' · ' + s.scene) +
        row('版本', (S.versionType === 'FORMAL' ? 'Official' : 'Test') + ' · ' + S.version) +
        row('批次名称', S.batchName || '—') +
        row('切片日', (S.sliceDate || s.sliceDate) + ' ' + s.sliceTime) +
        row('触发方式', S.scheduleMode === 'at' ? '定时执行 · ' + (S.scheduleAt || '未选时间').replace('T', ' ') : '立即执行') +
        row('客户分组', names + '（' + groups.length + ' 个）') +
        row('预计规模', wan(cfg.crowd) + ' 人') +
        row('报告', S.reports.length ? S.reports.map((c) => (REPORT_DEFS.find((d) => d.code === c) || {}).name).join('、') : '不生成') +
        row('对比批次', S.reports.length ? S.reports.map((c) => { const d = REPORT_DEFS.find((x) => x.code === c); return (d ? d.name : c) + ' → ' + (S.rptCompare[c] || '未填写'); }).join('；') : '—') +
        row('通知推送', S.webhook ? S.webhook + ' · ' + S.notifyEvents.length + ' 个场景' : '未配置') +
      '</div>' +
      '<div class="cf-note">发起后可在执行页随时停止；已写入的分片数据不会回滚。</div>' +
      '<div class="cf-foot"><button class="btn" data-confirm-cancel>取消</button><button class="btn primary" data-confirm-go>确认发起</button></div>' +
    '</div></div>';
  }

  function setView(view) { S.view = view; renderApp(); }
  function openBatch(id) {
    const b = BATCHES.find((x) => x.id === id); if (!b) return;
    S.batchId = id;
    S.tab = 'run';
    S.view = 'detail';
    renderApp();
  }

  function toast(msg) {
    const el = $('#toast'); el.textContent = msg; el.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { el.hidden = true; }, 2600);
  }

  function nextBatchId() {
    const head = S.strategy === 'credit_offline' ? '461' : '462';
    const d = new Date(Date.now() + 3 * 3600 * 1000);
    return head + '_' + d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds());
  }

  function startRun() {
    const _st0 = dayStatus(cur(), S.sliceDate || cur().sliceDate);
    if (!_st0 || _st0.pending || _st0.wallet !== 0 || _st0.od !== 0) { toast('所选切片日缺数，无法发起'); return; }
    if (!S.groups.length) { toast('请选择至少一个客户分组'); return; }
    if (S.running) return;
    if (!S.batchName.trim()) { toast('请填写批次名称'); const el = $('#batchName'); if (el) el.focus(); return; }
    const cfg = snap();
    if (cfg.crowd <= 0) { toast('至少选择一个客户分组'); return; }
    if (S.scheduleMode === 'at') {
      if (!S.scheduleAt) { toast('请选择执行时间'); return; }
      const b0 = { id: nextBatchId(), name: S.batchName.trim(), desc: '', status: 'scheduled', started: S.scheduleAt.replace('T', ' ') + ':00', ended: '', config: cfg, pushStep: 0, pushBatch: null, pushedAt: null, pct: 0, retries: 0, failShards: 0, repeat: S.scheduleRepeat };
      BATCHES.unshift(b0);
      S.view = 'list'; renderApp();
      toast('已创建定时跑批：' + b0.started);
      S.batchName = '';
      return;
    }
    const b = { id: nextBatchId(), name: S.batchName.trim(), desc: S.desc.trim(), status: 'running', started: nowText(), ended: '', config: cfg, pushStep: 0, pushBatch: null, pushedAt: null, pct: 0, retries: 0, failShards: 0 };
    BATCHES.unshift(b);
    S.batchId = b.id; S.view = 'detail'; S.tab = 'run'; S.running = true; S.pct = 0; S.lastShard = -1;
    renderApp();
    if (S.timer) cancelAnimationFrame(S.timer);
    const t0 = performance.now(), DUR = 5000;
    const step = function (ts) {
      S.pct = Math.min(1, (ts - t0) / DUR);
      updateRunLive();
      if (S.pct >= 1) { finishRun(); return; }
      S.timer = requestAnimationFrame(step);
    };
    S.timer = requestAnimationFrame(step);
    S.batchName = ''; S.desc = '';
    toast('跑批已发起：' + b.name);
  }

  function stopRun() {
    const b = currentBatch();
    if (!b || b.status !== 'running') return;
    S.running = false; if (S.timer) cancelAnimationFrame(S.timer); S.timer = null;
    b.status = 'stopped'; b.pct = S.pct;
    renderApp(); toast('已停止跑批（概念演示）');
  }

  function finishRun() {
    const b = currentBatch();
    S.running = false; if (S.timer) cancelAnimationFrame(S.timer); S.timer = null; S.pct = 1;
    if (!b) return;
    b.status = 'completed'; b.pct = 1;
    const total = totalMin(b.config);
    const end = new Date(), start = new Date(end.getTime() - total * 60000);
    b.started = fmtDT(start); b.ended = fmtDT(end);
    S.tab = 'report';
    renderApp(); toast('跑批完成，事件报告已生成');
  }

  function startPush() {
    const b = currentBatch();
    if (!b || b.status !== 'completed' || b.pushStep >= 3) return;
    b.pushStep = 1; renderApp();
    setTimeout(function () { b.pushStep = 2; renderApp(); }, 700);
    setTimeout(function () { b.pushStep = 3; b.pushedAt = nowText(); b.pushBatch = 'D' + b.id.slice(0, 8).replace(/_/g, '-') + '-01'; renderApp(); toast('已推送 LMS 批次 ' + b.pushBatch); }, 1500);
    setTimeout(function () { b.pushStep = 4; renderApp(); }, 2300);
  }

  function completePush() {
    const b = currentBatch();
    if (!b || b.pushStep < 3) return;
    b.pushStep = 5; renderApp(); toast('LMS 改额完成：' + wan(b.config.crowd) + ' 条已生效');
  }

  /* ---------- events ---------- */
  function bind() {
    document.addEventListener('change', function (e) {
      if (e.target.classList && e.target.classList.contains('me-in')) {
        const bb = currentBatch(); const pt = S.editCell.split(':')[1].split('-').map(Number);
        const k = +e.target.dataset.mrow, f = e.target.dataset.mfield;
        bb.mult3[S.mcat][pt[0]][pt[1]][k][f] = +e.target.value;
        renderApp(); return;
      }
      if (!e.target.classList || !e.target.classList.contains('mtx-num')) return;
      const b = currentBatch(); if (!b || !b.alloc3) return;
      const parts = e.target.dataset.mnum.split('-');
      const i = +parts[0], j = +parts[1];
      const max = +e.target.max || 0;
      let v = Math.round(+e.target.value || 0);
      v = Math.max(0, Math.min(max, v));
      b.alloc3[S.mcat][i][j] = v;
      renderApp();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (S.confirmOpen) { S.confirmOpen = false; renderApp(); } else if (S.groupOpen) { S.groupOpen = false; renderApp(); } } });
    document.addEventListener('click', function (e) {
      const nav = e.target.closest('[data-nav]');
      if (nav) { if (nav.dataset.nav === 'create') { S.batchName = ''; S.desc = ''; S.view = 'create'; } else { S.view = 'list'; } renderApp(); return; }
      const pg = e.target.closest('[data-page]');
      if (pg) { const v = pg.dataset.page; if (v === 'prev') S.page = Math.max(1, S.page - 1); else if (v === 'next') S.page = S.page + 1; else S.page = +v; renderApp(); return; }
      if (e.target.id === 'pageSize') { S.pageSize = +e.target.value; S.page = 1; renderApp(); return; }
      if (e.target.closest('[data-report-link]')) { toast('批次事件报告为独立页面，后续接入（mock）'); return; }
      const act = e.target.closest('[data-act]');
      if (act && !act.disabled) {
        const bb = BATCHES.find((x) => x.id === act.dataset.id);
        if (bb) {
          if (act.dataset.act === 'pause') { bb.status = 'stopped'; toast('已暂停：' + (bb.name || bb.id)); }
          if (act.dataset.act === 'stop') { bb.status = 'stopped'; toast('已终止：' + (bb.name || bb.id)); }
          if (act.dataset.act === 'resume') { bb.status = 'running'; toast('继续执行：' + (bb.name || bb.id)); }
          renderApp(); return;
        }
      }
      if (e.target.closest('[data-new]')) { S.batchName = ''; S.desc = ''; S.view = 'create'; renderApp(); return; }
      if (e.target.closest('[data-back]')) { S.view = 'list'; renderApp(); return; }
      const row = e.target.closest('[data-open]');
      if (row) { openBatch(row.dataset.open); return; }
      const tab = e.target.closest('[data-tab]');
      if (tab && tab.dataset.tab === 'report') S.reportView = 'list';
      if (tab) S.editCell = null;
      if (tab) { S.tab = tab.dataset.tab; renderApp(); return; }
      const launch = e.target.closest('[data-launch]');
      if (launch && !launch.disabled) {
        if (!S.groups.length) { toast('请选择至少一个客户分组'); return; }
        if (!S.batchName.trim()) { toast('请填写批次名称'); const el = $('#batchName'); if (el) el.focus(); return; }
        const miss = S.reports.find((c) => !(S.rptCompare[c] || '').trim());
        if (miss) { const d = REPORT_DEFS.find((x) => x.code === miss); toast('请填写「' + (d ? d.name : miss) + '」的对比批次'); const el = document.querySelector('[data-cmp="' + miss + '"]'); if (el) el.focus(); return; }
        S.confirmOpen = true; renderApp(); return;
      }
      if (e.target.closest('[data-confirm-cancel]')) { S.confirmOpen = false; renderApp(); return; }
      if (e.target.closest('[data-confirm-go]')) { S.confirmOpen = false; startRun(); return; }
      if (e.target.closest('[data-confirm-mask]') && !e.target.closest('.confirm')) { S.confirmOpen = false; renderApp(); return; }
      const stop = e.target.closest('[data-stop]'); if (stop) { stopRun(); return; }
      const mck = e.target.closest('.mtx-ck');
      if (mck) { const bb = currentBatch(); const td0 = mck.closest('[data-msel]'); const p2 = td0.dataset.msel.split('-'); const i = +p2[0], j = +p2[1]; bb.sel3[S.mcat][i][j] = !bb.sel3[S.mcat][i][j]; renderApp(); return; }
      const msel = e.target.closest('[data-msel]');
      if (msel) { S.editCell = S.mcat + ':' + msel.dataset.msel; renderApp(); return; }
      if (e.target.closest('[data-medone]')) { S.editCell = null; renderApp(); return; }
      if (e.target.closest('[data-madd]')) { const bb = currentBatch(); const pt = S.editCell.split(':')[1].split('-').map(Number); bb.mult3[S.mcat][pt[0]][pt[1]].push({ m: 1, s: 0 }); renderApp(); return; }
      const mdel = e.target.closest('[data-mdel]');
      if (mdel) { const bb = currentBatch(); const pt = S.editCell.split(':')[1].split('-').map(Number); bb.mult3[S.mcat][pt[0]][pt[1]].splice(+mdel.dataset.mdel, 1); renderApp(); return; }
      if (e.target.closest('[data-mall]')) { const bb = currentBatch(); bb.sel3[S.mcat] = bb.sel3[S.mcat].map(function (r) { return r.map(function () { return true; }); }); renderApp(); return; }
      if (e.target.closest('[data-mnone]')) { const bb = currentBatch(); bb.sel3[S.mcat] = bb.sel3[S.mcat].map(function (r) { return r.map(function () { return false; }); }); renderApp(); return; }
      const ne = e.target.closest('[data-nevent]');
      if (ne) { const k = ne.dataset.nevent; if (S.notifyEvents.indexOf(k) >= 0) S.notifyEvents = S.notifyEvents.filter((x) => x !== k); else S.notifyEvents.push(k); renderApp(); return; }
      const rc = e.target.closest('[data-rpt]');
      if (rc) { const c = rc.dataset.rpt; if (S.reports.indexOf(c) >= 0) S.reports = S.reports.filter((x) => x !== c); else S.reports.push(c); renderApp(); return; }
      const gt = e.target.closest('[data-gtoggle]');
      if (gt) { const id = gt.dataset.gtoggle; if (S.groups.includes(id)) { S.groups = S.groups.filter((x) => x !== id); } else { S.groups.push(id); } renderApp(); return; }
      const grem = e.target.closest('[data-gremove]');
      if (grem) { S.groups = S.groups.filter((x) => x !== grem.dataset.gremove); renderApp(); return; }
      if (e.target.closest('[data-gopen]')) {
        if (!S.groupOpen) {
          const box = document.querySelector('.gsel-box');
          S.groupUp = box ? box.getBoundingClientRect().bottom > window.innerHeight * 0.62 : false;
        }
        S.groupOpen = !S.groupOpen; renderApp(); return;
      }
      if (e.target.closest('[data-gdone]')) { S.groupOpen = false; renderApp(); return; }
      if (e.target.closest('[data-gclear]')) { S.groups = []; renderApp(); return; }
      if (S.groupOpen && !e.target.closest('.gsel')) { S.groupOpen = false; renderApp(); return; }
      if (e.target.closest('[data-new]')) { S.view = 'create'; renderApp(); return; }
      if (e.target.closest('[data-back-list]')) { S.view = 'list'; renderApp(); return; }
      if (e.target.closest('[data-report-open]')) { S.reportView = 'event'; renderApp(); return; }
      if (e.target.closest('[data-report-back]')) { S.reportView = 'list'; renderApp(); return; }
      if (e.target.closest('[data-report-soon]')) { toast('该报告模板待接入（' + e.target.closest('[data-report-soon]').dataset.reportSoon + '）'); return; }
      if (e.target.closest('[data-report-export]')) { toast('导出任务已创建（演示）'); return; }
      if (e.target.closest('[data-pdf]')) { toast('批次事件报告 PDF 已生成（演示）'); return; }
      if (e.target.closest('[data-report-all]')) { toast('已提交全部报告导出（演示）'); return; }
      const sc = e.target.closest('[data-sched]');
      if (sc) {
        S.scheduleMode = sc.dataset.sched;
        document.querySelectorAll('[data-sched]').forEach(function (b) { b.classList.toggle('on', b.dataset.sched === S.scheduleMode); });
        const ex = document.getElementById('schedExtra');
        if (ex) ex.innerHTML = schedExtraFields();
        return;
      }
      const mcat = e.target.closest('[data-mcat]');
      if (mcat) { S.mcat = mcat.dataset.mcat; renderApp(); return; }
      const mcell = e.target.closest('[data-mcell]');
      if (mcell) { const b = currentBatch(); const i = +mcell.dataset.mcell; if (b && b.pushSel && b.pushSel[S.mcat]) { b.pushSel[S.mcat][i] = !b.pushSel[S.mcat][i]; renderApp(); } return; }
      const push = e.target.closest('[data-push]');
      if (push && !push.disabled) {
        const b = currentBatch();
        if (!b || b.pushStep >= 3) return;
        if (!S.pushArm) { S.pushArm = true; renderApp(); setTimeout(function () { if (S.pushArm) { S.pushArm = false; renderApp(); } }, 6000); }
        else { S.pushArm = false; startPush(); }
        return;
      }
      const comp = e.target.closest('[data-complete]'); if (comp) { completePush(); return; }
      const mock = e.target.closest('[data-mock]'); if (mock) { toast('概念版演示：' + mock.dataset.mock + ' 暂未接入'); return; }
      const day = e.target.closest('.cal-col'); if (day) { S.selDay = day.dataset.day; renderApp(); return; }
      const rm = e.target.closest('[data-remove-group]');
      if (rm) { const id = rm.dataset.removeGroup; if (S.groups.length === 1) { toast('至少保留一个客户分组'); return; } S.groups = S.groups.filter((x) => x !== id); renderApp(); return; }
      if (e.target.closest('[data-toggle-cal]')) { S.calOpen = !S.calOpen; renderApp(); return; }
      if (e.target.closest('[data-open-groups]')) { openGroupPicker(); return; }
      if (e.target.closest('[data-close-picker]')) { closePicker(); return; }
      const pick = e.target.closest('[data-pick]');
      if (pick) { const id = pick.dataset.pick; if (S.pickerDraft.includes(id)) S.pickerDraft = S.pickerDraft.filter((x) => x !== id); else S.pickerDraft.push(id); renderPicker(); return; }
      if (e.target.closest('[data-picker-reset]')) { S.pickerDraft = []; renderPicker(); return; }
      const ok = e.target.closest('[data-picker-ok]');
      if (ok && !ok.disabled) { S.groups = S.pickerDraft.slice(); closePicker(); renderApp(); return; }
      const st = e.target.closest('[data-strategy]');
      if (st) { S.strategy = st.dataset.strategy; S.versionType = 'FORMAL'; S.groups = [STRATEGIES[S.strategy].groups[0].id]; S.selDay = STRATEGIES[S.strategy].sliceDate; renderApp(); return; }
      const ver = e.target.closest('[data-version]'); if (ver) { S.versionType = ver.dataset.version; renderApp(); return; }
    });
    document.addEventListener('input', function (e) {
      if (e.target.id === 'strategySel') {
        S.strategy = e.target.value;
        const st = STRATEGIES[S.strategy];
        if (!st.beta) S.versionType = 'FORMAL';
        S.version = (st.versions || [st.official])[0];
        S.reports = S.strategy === 'credit_offline' ? ['PRE_LOAN_OPERATION_REPORT', 'IN_LOAN_MODEL_STABILITY_REPORT'] : ['IN_LOAN_LIMIT_MIGRATION_REPORT', 'IN_LOAN_MODEL_STABILITY_REPORT', 'IN_LOAN_FULL_POPULATION_LIMIT_REPORT', 'IN_LOAN_FULL_POPULATION_FINAL_LIMIT_REPORT'];
        const ids = st.groups.map((g) => g.id);
        S.groups = S.groups.filter((id) => ids.indexOf(id) >= 0);
        if (!S.groups.length) S.groups = [ids[0]];
        S.selDay = st.sliceDate;
        renderApp();
      }
      if (e.target.id === 'versionSel') { S.versionType = e.target.value; renderApp(); }
      if (e.target.id === 'bizSel') { S.business = e.target.value; renderApp(); }
      if (e.target.id === 'verSel') { S.version = e.target.value; renderApp(); }
      if (e.target.id === 'batchName') S.batchName = e.target.value;
      if (e.target.id === 'schedAt') S.scheduleAt = e.target.value;
      if (e.target.id === 'schedRepeat') S.scheduleRepeat = e.target.value;
      if (e.target.id === 'sliceInput') { S.sliceDate = e.target.value; S.selDay = e.target.value; renderApp(); }
      if (e.target.id === 'webhook') S.webhook = e.target.value;
      if (e.target.dataset && e.target.dataset.cmp) S.rptCompare[e.target.dataset.cmp] = e.target.value;
      if (e.target.id === 'batchDesc') S.desc = e.target.value;
      if (e.target.id === 'gSearch') { S.gsearch = e.target.value; renderApp(); const i = $('#gSearch'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
    });
    $('#hideBtn').addEventListener('click', function () {
      const app = $('#app'); app.classList.toggle('collapsed');
      $('#hideLabel').textContent = app.classList.contains('collapsed') ? 'Show Menu' : 'Hide Menu';
    });
  }

  function clock() {
    const el = $('#clock');
    function tick() {
      const d = new Date(Date.now() + 3 * 3600 * 1000);
      el.textContent = d.getUTCFullYear() + '/' + pad(d.getUTCMonth() + 1) + '/' + pad(d.getUTCDate()) + ' ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
    }
    tick(); setInterval(tick, 1000);
  }

  function init() {
    const sliceDay = dateISO(addDays(new Date(), -2));
    Object.values(STRATEGIES).forEach((x) => { x.sliceDate = sliceDay; });
    S.todayISO = dateISO(new Date());
    S.sliceDate = dateISO(addDays(new Date(), -2));
    S.selDay = S.sliceDate;
    bind(); renderApp(); clock();
  }

  init();
})();

</script>
</body>
</html>
