<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>risk control platform</title>
<style>
  :root {
    --ink: #081936;
    --muted: #75798A;
    --faint: #9AA1B6;
    --blue: #6193F7;
    --line: #E6E8EF;
    --page: #F5F6FA;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    font-size: 14px;
    color: var(--ink);
    background: var(--page);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: auto;
    overflow-y: hidden;
  }
  .app { display: flex; height: 100vh; min-height: 640px; position: relative; }
  .sidebar {
    flex: 0 0 252px; width: 252px; background: #fff;
    box-shadow: 2px 0 8px rgba(29, 35, 41, .05);
    position: relative; z-index: 5;
    transition: width .28s cubic-bezier(.645,.045,.355,1), flex-basis .28s cubic-bezier(.645,.045,.355,1);
    overflow: hidden;
  }
  .brand { padding: 28.5px 0 0 35.5px; }
  .brand img { display: block; width: 180.5px; height: auto; }
  .nav { margin-top: 26.5px; }
  .nav-item {
    height: 54px; display: flex; align-items: center;
    padding: 0 22.1px 0 27.5px; cursor: pointer;
    color: var(--ink); font-size: 14px; line-height: 1;
    transition: background .2s;
    user-select: none;
  }
  .nav-item:hover { background: rgba(80, 149, 255, .05); }
  .nav-item .ico { width: 20.5px; height: 20.5px; flex: 0 0 20.5px; margin-right: 12px; }
  .nav-item .label { flex: 1 1 auto; white-space: nowrap; transform: translateY(.5px); }
  .chev { width: 9px; height: 5.4px; flex: 0 0 9px; color: var(--ink); opacity: .92; }
  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    flex: 0 0 56px; height: 56px; background: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 30.5px 0 22px;
    box-shadow: 0 2px 3px rgba(151, 160, 195, .08);
    position: relative; z-index: 4;
  }
  .hide-btn {
    display: flex; align-items: center; gap: 6.5px; position: relative; top: -0.5px;
    background: none; border: 0; padding: 0; margin: 0;
    font: inherit; font-size: 14px; color: var(--muted); cursor: pointer;
    transition: color .2s;
  }
  .hide-btn:hover { color: var(--ink); }
  .hide-btn svg { width: 14px; height: 14px; display: block; }
  .top-right { display: flex; align-items: center; }
  .timepill {
    position: relative; width: 279.5px; height: 30px; flex: 0 0 279px;
    border: 1px solid var(--line); border-radius: 15px;
    background: #fff; white-space: nowrap;
  }
  .timepill .clk { position: absolute; left: 16px; top: 6px; width: 16px; height: 16px; display: block; }
  .timepill .tz { position: absolute; left: 40.5px; top: 50%; transform: translateY(-50%); color: var(--blue); font-size: 12.5px; }
  .timepill .date { position: absolute; left: 125.5px; top: 50%; transform: translateY(calc(-50% - 1.5px)); color: var(--muted); font-size: 12px; }
  .timepill .sync { position: absolute; left: 249.5px; top: 8px; width: 12px; height: 12px; display: block; color: var(--muted); cursor: pointer; }
  .vdiv { width: 1px; height: 24px; background: var(--line); margin: 0 0 0 19px; }
  .user { display: flex; align-items: center; margin-left: 18.5px; cursor: pointer; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; background: #EFF2FE; display: block; }
  .uname { margin-left: 8px; font-size: 14.2px; color: var(--muted); white-space: nowrap; transform: translateY(-0.5px); }
  .subbar {
    flex: 0 0 42px; height: 42px; background: #FBFBFD;
    border-bottom: 1px solid #E8EAF2;
    box-shadow: 0 2px 4px rgba(151, 160, 195, .08);
    position: relative; z-index: 3;
  }
  .content { flex: 1 1 auto; min-height: 0; padding: 23px 24px 24px; background: var(--page); }
  .card {
    height: 100%; background: #fff; border-radius: 16px;
    box-shadow: 0 2px 4px rgba(151, 160, 195, .1);
    position: relative; overflow: hidden;
  }
  .empty { padding-top: 136px; text-align: center; }
  .empty img { display: block; width: 285.65px; height: auto; margin: 0 auto; position: relative; top: .5px; }
  .empty p { margin: -2px 0 0; position: relative; top: .5px; font-size: 12px; line-height: 20px; color: var(--faint); }
  .fab {
    position: absolute; right: 8px; top: 60.2%; width: 28px; height: 28px;
    border-radius: 50%; background: #EEB7C6; border: 0; padding: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 0 0 10px rgba(255, 255, 255, .55), 0 6px 18px rgba(29, 35, 41, .06);
    z-index: 20;
  }
  .fab svg { width: 20px; height: 20px; display: block; }
  .app.collapsed .sidebar { width: 0; flex-basis: 0; }
</style>
</head>

<script>
(function () {
  var clockEl = document.getElementById('clock');
  var frozen = /(?:^|[?&])frozen=1(?:&|$)/.test(location.search);
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var now = new Date(Date.now() + 3 * 3600 * 1000);
    clockEl.textContent = now.getUTCFullYear() + '/' + pad(now.getUTCMonth() + 1) + '/' + pad(now.getUTCDate())
      + ' ' + pad(now.getUTCHours()) + ':' + pad(now.getUTCMinutes()) + ':' + pad(now.getUTCSeconds());
  }
  if (!frozen) { tick(); setInterval(tick, 1000); }

  var app = document.getElementById('app');
  document.getElementById('hideBtn').addEventListener('click', function () {
    app.classList.toggle('collapsed');
    document.getElementById('hideLabel').textContent = app.classList.contains('collapsed') ? 'Show Menu' : 'Hide Menu';
  });
})();
